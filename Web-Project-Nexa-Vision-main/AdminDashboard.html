<!-- ADMIN USER MANAGEMENT DASHBOARD -->
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="utf-8">
    <title>Admin Dashboard - User Management</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        .admin-badge { @apply px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-xs font-semibold; }
        .user-badge { @apply px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold; }
        .active-badge { @apply px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold; }
        .inactive-badge { @apply px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-xs font-semibold; }
        .btn-sm { @apply px-2 py-1 text-xs rounded; }
        .modal-overlay { @apply fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50; }
    </style>
</head>

<body class="relative font-inter antialiased bg-slate-50">
    <!-- Auth Check Container -->
    <div id="auth-container" class="hidden">
        <header id="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>MEGASYST</h1>
            </div>

            <nav>
                <ul id="navbar">
                    <li><a href="Control.html" style="font-size: 24px;">نظام التحكم</a></li>
                    <li><a href="index.html" style="font-size: 24px;">الرئيسية</a></li>
                </ul>
            </nav>

            <div id="mobile">
                <i id="bar" class="fas fa-outdent"></i>
            </div>
        </header>

        <main class="min-h-screen py-8">
            <div class="w-full max-w-7xl mx-auto px-4">
                <!-- Header with User Info -->
                <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-lg shadow">
                    <div>
                        <h1 class="text-3xl font-bold text-slate-900">Admin Dashboard</h1>
                        <p class="text-slate-600 mt-1">Welcome, <span id="current-user" class="font-semibold">Admin</span></p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="loadUsers()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                        <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-600 text-sm">Total Users</p>
                                <p id="total-users" class="text-3xl font-bold text-slate-900">0</p>
                            </div>
                            <i class="fas fa-users text-4xl text-blue-400 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-600 text-sm">Admins</p>
                                <p id="total-admins" class="text-3xl font-bold text-slate-900">0</p>
                            </div>
                            <i class="fas fa-shield-alt text-4xl text-purple-400 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-600 text-sm">Active Users</p>
                                <p id="total-active" class="text-3xl font-bold text-slate-900">0</p>
                            </div>
                            <i class="fas fa-check-circle text-4xl text-green-400 opacity-50"></i>
                        </div>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="bg-white shadow-xl rounded-lg overflow-hidden">
                    <header class="px-6 py-4 border-b border-slate-200 bg-slate-50">
                        <h2 class="text-xl font-semibold text-slate-900">Users Management</h2>
                    </header>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-slate-100 border-b border-slate-200">
                                <tr class="text-xs text-slate-600 font-semibold">
                                    <th class="px-6 py-3 text-left">#</th>
                                    <th class="px-6 py-3 text-left">Username</th>
                                    <th class="px-6 py-3 text-left">Email</th>
                                    <th class="px-6 py-3 text-left">Role</th>
                                    <th class="px-6 py-3 text-left">Status</th>
                                    <th class="px-6 py-3 text-left">Joined</th>
                                    <th class="px-6 py-3 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-body" class="divide-y divide-slate-200">
                                <!-- Users populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Login/Register Container -->
    <div id="auth-form-container" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600">
        <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-900">MEGASYST</h1>
                <p class="text-slate-600">Admin Dashboard</p>
            </div>

            <div id="login-form" class="space-y-4">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Login</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Username</label>
                    <input type="text" id="login-username" class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Password</label>
                    <input type="password" id="login-password" class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter password">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Login</button>
                <button onclick="showRegisterForm()" class="w-full text-blue-600 py-2 font-semibold hover:text-blue-700">Create Account</button>
            </div>

            <div id="register-form" class="space-y-4 hidden">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Create Account</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Username</label>
                    <input type="text" id="reg-username" class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Choose username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email</label>
                    <input type="email" id="reg-email" class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter email">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Password</label>
                    <input type="password" id="reg-password" class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter password (min 6 chars)">
                </div>
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">Register</button>
                <button onclick="showLoginForm()" class="w-full text-blue-600 py-2 font-semibold hover:text-blue-700">Back to Login</button>
            </div>

            <div id="error-message" class="hidden mt-4 p-3 bg-red-100 text-red-800 rounded-lg text-sm"></div>
            <div id="success-message" class="hidden mt-4 p-3 bg-green-100 text-green-800 rounded-lg text-sm"></div>
        </div>
    </div>

    <!-- Modal for User Actions -->
    <div id="action-modal" class="modal-overlay hidden">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
            <h3 id="modal-title" class="text-lg font-bold mb-4">Confirm Action</h3>
            <p id="modal-message" class="text-slate-600 mb-6"></p>
            <div class="flex gap-3 justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-300 text-slate-900 rounded-lg hover:bg-slate-400">Cancel</button>
                <button id="modal-confirm-btn" onclick="confirmAction()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Confirm</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="Dashboard/dashboard-admin.js"></script>
</body>

</html>
