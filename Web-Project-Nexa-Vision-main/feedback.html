<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Feedback</title>
</head>

<body style="font-family: Arial; text-align: center;">

    <h1>System Feedback Form</h1>
    <p>Please help us improve our system by sharing your opinion</p>

    <form>

        <input type="text" placeholder="Your Name"><br><br>

        <input type="email" placeholder="Your Email"><br><br>

        <p>Rate the system:</p>
        <input type="radio" name="rate"> 1 
        <input type="radio" name="rate"> 2
        <input type="radio" name="rate"> 3
        <input type="radio" name="rate"> 4
        <input type="radio" name="rate"> 5
        <br><br>

        <p>Is the system easy to use?</p>
        <input type="radio" name="easy"> Yes
        <input type="radio" name="easy"> No
        <br><br>

        <p>How do you rate the design?</p>
        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>

        <p>Any suggestions?</p>
        <textarea rows="4" cols="40"></textarea>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
