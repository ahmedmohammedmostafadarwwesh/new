    <script>
        async function loadDashboard() {
            const tbody = document.getElementById('dashboard-body');
            if (!tbody) return;
            tbody.innerHTML = ''; // clear any placeholder rows
            try {
                const res = await fetch('http://localhost:8001/api/dashboard');
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                data.forEach((row) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-slate-500">${row.id}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="flex items-center">
                                <img src="I1.img.jpg" alt="" class="shrink-0 mr-2 sm:mr-3 rounded-full" width="36" height="36" />
                                <div class="text-slate-900">${row.name}</div>
                            </div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-slate-500">${row.col1}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-slate-900">${row.col2}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-slate-900">${row.col3}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-emerald-500">${row.col4}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-yellow-500">${row.col5}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-red-500">${row.col6}</div>
                        </td>
                        <td class="px-5 py-3 border-b border-slate-200 last:border-none first:pl-3 last:pr-3">
                            <div class="text-slate-900">
                                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-2 rounded" onclick="editRow(${row.id})">Edit</button>
                                <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded" onclick="deleteRow(${row.id})">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Failed to load dashboard data', err);
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:20px; color:red;">Error loading data: ${err.message}</td></tr>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
